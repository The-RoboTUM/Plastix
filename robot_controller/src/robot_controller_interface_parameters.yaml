controller_manager:
  ros__parameters:
    update_rate: 100

    robot_controller:
      type: robot_controller_interface/RobotControllerInterface


robot_controller:
  ros__parameters:
    front_left_wheel_name: front_left_wheel_joint
    front_right_wheel_name: front_right_wheel_joint
    rear_left_wheel_name: rear_left_wheel_joint
    rear_right_wheel_name: rear_right_wheel_joint

    open_loop: false
    position_feedback: true
    enable_odom_tf: true

    odom_frame_id: odom
    base_frame_id: base_link
    publish_rate: 50.0

    wheel_radius: 0.05
    wheel_separation_x: 0.30
    wheel_separation_y: 0.25

    cmd_vel_timeout: 0.5
