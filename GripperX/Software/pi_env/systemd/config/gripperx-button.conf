# /etc/gripperx/gripperx-button.conf
#
# Configuration for gripperx-button-daemon.py (HWR-40 clean-shutdown button).
# Format: key = value, one per line, "#" starts a comment. No shell, no eval --
# the daemon parses this by hand so a typo cannot execute anything.
#
# NOT INSTALLED ON DELIVERY. The daemon refuses to act if this file is missing
# (it logs and idles rather than falling back to built-in defaults for the
# safety-relevant keys).

# --- GPIO -------------------------------------------------------------------
# RP1 header GPIO chip of the Raspberry Pi 5. Same chip as the LiDAR power
# relay; see gripperx_control/config/lidar_power.yaml for the mode/group note
# (0660, group dialout, user ubuntu is in dialout -> no root needed FOR GPIO).
gpio_chip_path = /dev/gpiochip4
# BCM GPIO17 = line offset 17 on the chip above. Bench-verified 2026-08-19:
# line 17 free (used=False, consumer=None). Line offset == BCM number here,
# exactly as the GPIO23 entry in lidar_power.yaml.
gpio_line_offset = 17
# Shows up as the line's consumer, so a claimed line traces back to this daemon.
gpio_consumer_name = gripperx_button
# Button module has its own pull-up; idle HIGH, pressed LOW. The bias flag is
# requested in addition (belt and braces) and skipped automatically if the
# installed libgpiod does not expose it.
active_low = true
bias_pull_up = true

# --- Timing -----------------------------------------------------------------
# Poll interval. Deliberately polling, not edge events: a poll can only ever
# MISS a press (nothing happens -- the safe failure), whereas edge handling adds
# state that can fire spuriously. 20 ms cannot miss a real press; the bench
# measurement was 230 ms.
poll_interval_sec = 0.02
# Debounce. The bench measurement found no bounce >= 1 ms, so this is margin,
# not a fix for an observed problem.
debounce_sec = 0.02
# THE DEAD ZONE. short_press_max_sec < press < long_press_min_sec is DISCARDED
# on purpose: a marginal press must not silently pick the wrong action. The gap
# is the safety feature, not an oversight -- do not close it.
#   press <  1.0 s            -> Mode R (restart the stack, Pi stays up)
#   1.0 s <= press < 3.0 s    -> DISCARDED, logged, nothing happens
#   press >= 3.0 s            -> Mode H (stack down, Pi halts)
short_press_max_sec = 1.0
long_press_min_sec = 3.0
# Escape hatch threshold -- see very_long_press_action below.
very_long_press_min_sec = 10.0

# --- Actions ----------------------------------------------------------------
# The ONE implementation of the stop sequence (SR-12 rev 3 / S2). The daemon
# decides WHICH MODE; it never reimplements the sequence. A caller that
# reimplements it is a defect.
stop_command = /usr/bin/sudo -n /usr/local/bin/gripperx-stack-stop
# What a very long hold does. PROPOSAL, ships as "warn":
#   warn  -- log CRITICAL and do nothing else (SHIPPED DEFAULT)
#   halt  -- skip the ordered sequence and call `systemctl poweroff --force`
#   none  -- not even a log line
# See the long-hold rationale in gripperx-button-daemon.py before changing this.
very_long_press_action = warn

# --- SAFETY INTERLOCK -------------------------------------------------------
# MODE R IS DISARMED. It stays disarmed. What follows is WHY -- and the reason
# is no longer the one this block used to give.
#
# SUPERSEDED PREMISE (corrected 2026-08-25). This block used to say: "A stack
# restart TODAY drives all four steering servos to center_counts." That was true
# when it was written. It is NOT true of the tree deployed now, and all four
# conditions it named as undeployed ARE deployed:
#   1. steer_servo_node `center_on_startup: false` (OP-20 option B) -- startup
#      and respawn adopt the measured position instead of centring.  DEPLOYED
#      (gripperx_control/config/steer_servo.yaml:273).
#   2. GripperXInterface::on_deactivate() calling publish_stop_commands()
#      instead of publish_zero_commands() (defect D-SD1).  DEPLOYED, both
#      halves, closed 2026-08-19 (17cb6d8).
#   3. steer_servo_node._on_timer holding the last commanded angles on a stale
#      /hw/joint_commands instead of writing zeros (OP-24 / S1).  DEPLOYED
#      (steer_servo_node.py:745).
#   4. The former "still open" item -- on_activate() publishing zero commands --
#      is closed too: it uses stop semantics, and the SR-14 activation gate
#      seeds the MEASURED angles.  Bringing the controllers back up is no
#      longer a centring move.
#
# MEASURED, 2026-08-25, two independent runs:
#   * Cold boot 11:33, true power cycle, bringup started by systemd:
#     "swerve_controller activated. No command written on activation" and
#     "Steering held at the measured angle [-0.0890, 0.0567, 0.0368, -0.0705]
#     rad, wheels zero" -- i.e. it HELD the limp angles left by the preceding
#     stop; it did not centre. SR-14 gate acquired after 3.291 s (timeout 120 s).
#   * Full restart ~12:55 via `gripperx-stack-stop --mode=restart
#     --approve-motion`, robot ON BLOCKS, explicit per-test user approval:
#     /hw/steer_states byte-identical before and after; all six lifecycle nodes
#     back to active [3]. SR-12 S4's "a full restart produces no actuator
#     motion" is MET.
#
# WHY MODE R IS STILL DISARMED -- three reasons, none of them 1-4 above:
#   (a) PROCESS, not code. SR-1 requires explicit user approval per motion-
#       triggering test. An unattended short press is a restart nobody approved.
#       The 12:55 run was approved; a button press is not. Arming is the USER's
#       decision to make, and it has not been made.
#   (b) SR-12's binding order is not finished: ExecStop is NOT wired yet.
#   (c) THE RESULT IS CONDITIONAL ON TWO SETTINGS, each one line from being
#       false: `center_on_startup: false`, and `arm_home_on_startup:=false` --
#       which is an INTERIM tied to open issue #340 (arm poses stale / not
#       re-taught), passed only by gripperx-bringup.sh. The launch default and
#       the node default are both `true`, so the protection is NON-STRUCTURAL.
#       Lift the interim, or flip center_on_startup, and a restart moves again.
#
# A restart therefore remains a MOTION TRIGGER. What changed is only that on
# THIS tree, in THIS configuration, it demonstrably does not move.
mode_r_enabled = true
# Mode H needs no such gate: it commands nothing on the way up, and the steering
# is left LIMP at its last angle (Q-SD5, decided -- no parking, no centring).
mode_h_enabled = true
