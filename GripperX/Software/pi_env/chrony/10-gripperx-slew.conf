# GripperX — time discipline: step only while first synchronising after
# boot, slew for every correction after that.
#
# Target on the Pi: /etc/chrony/conf.d/10-gripperx-slew.conf
# (relies on `confdir /etc/chrony/conf.d` in /etc/chrony/chrony.conf — this
# is the Ubuntu-packaged default; see the internal time-discipline deploy note, step 1 (tracked
# internally, not in this repository), for
# why this must be CONFIRMED on the Pi, not assumed).
#
# Decision reference: REQUIREMENTS (internal) FR-12 §10.1 item 11 / internal SAFETY
# §6.4 item 9 (user, 2026-08-20). On the robot use_sim_time=false, so the
# ROS clock IS the system clock (goal_gateway_node.py _ros_now()). A
# backwards step of the system clock larger than _clock_backward_eps_sec is
# a CLOCK_JUMPED_BACK auto-disarm with a goal cancel (SR-15 rule 7/12). The
# Pi's internet is NAT'd through the laptop and flaky, so a time-sync step
# at reconnect is a plausible event, not a theoretical one — this file
# removes that as a common cause by never stepping past the initial sync.
#
# makestep <threshold-seconds> <limit>
#   If the correction chronyd wants to apply is larger than <threshold>
#   seconds, step the clock instead of gradually slewing it — but ONLY for
#   the first <limit> clock updates counted from chronyd's own start (a
#   negative <limit> would mean "no limit, always allowed to step", which
#   is NOT what we want here). Once <limit> updates have happened, EVERY
#   later correction is slewed (adjusted gradually, via a bounded frequency
#   offset) NO MATTER HOW LARGE the offset is — chronyd does not fall back
#   to stepping just because a correction would take a long time to slew.
#   That second half is the load-bearing property for this decision: a
#   routine reconnect after the flaky NAT'd link comes back no longer
#   produces a discontinuity at all, so CLOCK_JUMPED_BACK stops firing for
#   a reason that has nothing to do with the robot.
#
#   Values chosen: threshold=1.0s, limit=3 — this is the Ubuntu-packaged
#   default (see /etc/chrony/chrony.conf on any stock Ubuntu 24.04 chrony
#   install), kept deliberately rather than inventing a new number. limit=3
#   also happens to fit this robot's known hardware quirk (no RTC backup
#   battery — see the laptop-side /etc/chrony/conf.d/gripperx.conf note on
#   this: the Pi's clock starts at 1970 on every boot and only becomes
#   correct once a source is reachable): a handful of updates is what
#   chronyd typically needs before it trusts an estimate enough to step on
#   it, so this comfortably covers "first sync after boot" without also
#   granting a stepping allowance to some later, unrelated reconnect.
makestep 1.0 3
