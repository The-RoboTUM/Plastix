; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_microros_transport = serial
board_microros_distro = jazzy
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
lib_deps = 
	https://github.com/micro-ROS/micro_ros_platformio
	workloads/SCServo@^1.0.1
build_flags = 
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

; Direct teleop via Serial — without ROS2
; pio run -e teleop -t upload && pio device monitor -e teleop
[env:teleop]
extends = env:esp32dev
build_src_filter = +<motor_controller.cpp> +<teleop_solo.cpp> -<main.cpp>
lib_deps = 
	workloads/SCServo@^1.0.1
