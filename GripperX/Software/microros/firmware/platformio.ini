; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_microros_transport = serial
board_microros_distro = jazzy
; YD-ESP32-S3-N16R8: 16 MB flash. Octal PSRAM is intentionally left off
; (memory_type unset) — firmware does not use PSRAM and a wrong memory_type is
; the main N16R8 boot-hang risk. To enable later: board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; Exclude the bench-only pin_test.cpp (it defines its own setup()/loop() and is
; built solely by [env:pintest]) so the production build does not collide.
build_src_filter = +<*> -<pin_test.cpp>
; Always the udev symlink, never a raw ttyACM number. All three serial adapters on
; the Pi are the same CH343 (1a86:55d3, bcdDevice 4.45) and are only distinguishable
; by serial number, so the ACM numbering follows plug order. On 2026-08-13 the Pi
; enumerated ttyACM0 as /dev/arm_servo — flashing to a hardcoded ttyACM0 would have
; written to the arm servo bus. /dev/esp32 = serial 5B7A022924 (99-gripperx.rules).
upload_port = /dev/esp32
monitor_port = /dev/esp32
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
lib_deps =
	https://github.com/micro-ROS/micro_ros_platformio
build_flags =
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

; Bench-only pin-test firmware (src/pin_test.cpp) — verifies each drive pin
; (PWM/DIR, WIRING_PLAN.md §1) and all four encoder pairs (PCNT) at the
; header with the Cytron MDD10A driver disconnected. No micro-ROS needed.
; pio run -e pintest -t upload && pio device monitor -e pintest
[env:pintest]
extends = env:esp32-s3
build_src_filter = +<pin_test.cpp> -<main.cpp> -<motor_controller.cpp>
lib_deps =
