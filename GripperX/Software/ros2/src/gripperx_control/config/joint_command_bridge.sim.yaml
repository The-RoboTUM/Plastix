joint_command_bridge:
  ros__parameters:
    command_topic: /swerve_cmd_joint_states
    steering_command_topic: /steering_position_controller/commands
    wheel_command_topic: /wheel_velocity_controller/commands
    steering_joint_names:
      - f_left_steer
      - f_right_steer
      - b_leftsteer
      - b_rightsteer
    wheel_joint_names:
      - f_leftwheel
      - f_rightwheel
      - b_leftwheel
      - b_rightwheel
    # Digital twin (DT-4/M2 investigation): in the URDF (gripperx_v1.core.xacro)
    # the right-side wheel joints have axis "0 0 -1" while otherwise sharing
    # the same rpy as the left wheels -> a positive velocity command spins
    # the right sim wheels BACKWARDS. On the real machine the motor wiring
    # compensates for this (correctly [1,1,1,1] there in
    # joint_command_bridge.yaml); in the sim the bridge must invert the
    # right wheels, otherwise the robot drives sideways and veers off on a
    # straight-ahead command. This file is loaded EXCLUSIVELY by the sim path
    # (simulate_robot.launch.py -> control.launch.py bridge_config); the real
    # path stays unchanged.
    wheel_command_multipliers:
      - 1.0
      - -1.0
      - 1.0
      - -1.0
    # DT-10: In the sim, sim_steer_bridge publishes the steering commands to
    # /steering_position_controller/commands (real servo steering path via
    # /teleop/direct_steer, arbitrated the same as on the real robot by
    # steer_servo_node). This bridge must then NOT publish steering anymore,
    # otherwise two publishers fight over the same topic. Here it only
    # supplies the wheel velocities. (The real robot doesn't use this bridge
    # anyway.)
    publish_steering: false
