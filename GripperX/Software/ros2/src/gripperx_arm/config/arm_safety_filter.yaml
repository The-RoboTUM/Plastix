# SR-17 (arm safety envelope) layer L3 and FR-17 (leader-arm teleoperation) follower
# settings of arm_action_server. Loaded together with arm_poses.yaml (arm.launch.py).
#
# Geometry, joint limits and collision boxes are NOT here: the filter reads them from
# the running robot description (/robot_description, generated from
# gripperx_geometry/config/geometry.yaml + the xacro), the tick calibration from
# arm_calibration.yaml, the allowed link pairs from arm_allowed_collisions.yaml and the
# steering stops from gripperx_control/config/steer_servo.yaml. A value below marked
# TO-VERIFY is a placeholder nobody has measured or decided; it is NOT a safety margin.
arm_action_server:
  ros__parameters:
    safety_filter:
      # Marker that THIS file was loaded. The node declares it false; while it is
      # false the node logs an ERROR and refuses leader mode, P (pick) and I (go_home)
      # (SR-17 rule 12: no filter configuration -> P and I refused); only gripper moves
      # (O) still run. Every launch that starts arm_action_server must load this file
      # (arm.launch.py, gripperx_bringup real_robot.launch.py).
      config_loaded: true
      robot_description_topic: /robot_description
      calibration_file: ""        # "" = gripperx_arm/config/arm_calibration.yaml (share)
      acm_file: ""                # "" = gripperx_arm/config/arm_allowed_collisions.yaml
      # "" = gripperx_arm/config/arm_stop_protected.yaml (GENERATED by
      # `python3 -m gripperx_arm.stop_protected`): self-pairs the mechanical stops keep
      # apart, never checked. Missing file = every pair checked.
      stop_protected_file: ""
      steer_config_file: ""       # "" = gripperx_control/config/steer_servo.yaml
      # Order of /hw/steer_states and of every array in steer_servo.yaml
      # (steer_servo_node STEER_JOINT_NAMES; a test checks the two agree).
      steer_joint_names: [f_left_steer, f_right_steer, b_leftsteer, b_rightsteer]
      ground_frame: base_footprint

      # D1, user decision 2026-10-07: the tip stays >= 1 cm above z = 0 of
      # base_footprint (flat ground, OP-42 (c)). Checked on every box of tip_links
      # (both jaws: limb5 carries the fixed jaw, gripper the moving one) and on the TCP.
      ground_clearance_tip_m: 0.01
      tip_links: [arm_limb5_link, arm_gripper_link]
      # TO-VERIFY, OP-42 (d) still open: the requirements agent's proposal (non-tip
      # links get the tip's 1 cm). Not a user decision.
      ground_clearance_links_m: 0.01
      # TO-VERIFY, OP-42 (d) still open: 0 mm beyond collision boxes that fully enclose
      # the meshes (coordinator proposal, not decided). The boxes enclose the meshes by
      # >= 1.9 mm per arm_allowed_collisions.yaml `padding`; the body boxes have no such
      # report. Applies to the arm BOXES only; where body_hull_stage confirms a box
      # overlap on the arm link's hull, that padding is gone and body_hull_clearance_m
      # applies instead.
      body_clearance_m: 0.0
      self_clearance_m: 0.0
      # TO-VERIFY. Paths are split so no joint moves more than this between two checked
      # poses. NOT a safety bound: every checked pose is grown by a model-derived bound
      # of the motion to its neighbours, so a larger step is still covered, only more
      # conservatively (more false rejections near the body). 2 deg = first choice.
      max_joint_step_rad: 0.0349
      # Self-contact recovery (user decision 2026-10-09, option C; SR-17 rules 12/13).
      # The arm can come to rest with two of its own links in contact on the model's
      # simplified shapes (convex hulls of the meshes) - e.g. limb3 at its lower stop
      # against limb1 - and every plan from there was refused. operator_go_home: the
      # operator's I (go_home) may start there if every such ARM SELF pair separates
      # (clearance non-decreasing at every setpoint until the normal self check
      # passes); chassis, wheel and ground contacts are never relaxed; the automatic
      # return home and startup homing hold and report "press I to separate"; P and
      # leader activation stay refused. off: every self-contact start is refused.
      self_contact_recovery: operator_go_home
      # How far a separating pair's clearance may dip below its start value BETWEEN two
      # written setpoints (the motion bound of one step; not provable to be zero from
      # contact). TO-VERIFY: 0.25 mm covers one 30 Hz setpoint of the 4.267 s home ramp
      # from the measured resting pose with limb3 at its stop (bound 0.10-0.22 mm,
      # 2026-10-09, offline); 0 = no separation possible.
      self_contact_dip_m: 0.00025
      # Ground-margin recovery (user decision 2026-10-12; SR-17). Leader mode can leave
      # the arm resting inside the ground margin (a rejected setpoint is held, the arm
      # sags under gravity) and every plan from there was refused at its start.
      # operator_go_home: the operator's I may start there - every link failing the
      # ground check at sub-step 0, grown for the first step's motion (audit r11 F1: so
      # also a start statically just above 10 mm) - if the path first lifts it ONE JOINT
      # AT A TIME (a lagging servo stays on the certified way, audit r11 F2), clearance
      # strictly rising at every setpoint until the normal ground check passes, and
      # certified above the ground (> 0) anywhere between two setpoints (only that, not
      # "never below the start clearance": user decision 2026-10-12, option a). A start at
      # or below the ground (the model penetrating it, the real arm resting on the floor)
      # is accepted the same way (user decision 2026-10-15), except that between two
      # setpoints a link in the ground is held to its exact lowest point - and each of its
      # box corners in the ground to its own height - never sinking below the setpoint
      # before; a held start whose measured pose is in the ground starts measured.
      # Chassis, wheel and self checks are never relaxed. The automatic return home, P's
      # return, gateway P and startup homing stay refused; P is unchanged.
      #   operator         - the operator's I AND leader re-plans (user decision
      #                      2026-10-20, SR-17 rule 13): a held leader start inside the
      #                      margin for its first step is lifted out the same way (one
      #                      joint at a time, strictly rising, certified above the ground
      #                      between setpoints; only from the path's start, never a new
      #                      lift mid-path; never from at or below the ground - that stays
      #                      I's). Each rising step is re-checked when written from the
      #                      measured pose (non-ground checks, and the lifting links
      #                      certified > 0 over the step's joint box).
      #   operator_go_home - the operator's I only (the 2026-10-12 scope)
      #   off              - every start inside the margin is refused.
      # No extra margin: the ground clearances above stay as they are (user, 2026-10-12).
      ground_recovery: operator
      # Right before the lift's first write the present positions are read again; an arm
      # that moved more than this many ticks on any limb servo since the planning read
      # (it sags while the path is planned, seconds) is refused, nothing written.
      # TO-VERIFY: 2 = one tick of reading noise plus one.
      ground_recovery_start_drift_ticks: 2
      # During the lift the present positions are read after every written setpoint: a
      # link statically below its margin at that read, MEASURED this far below its
      # start clearance at two reads in a row (the servo sags under load instead of
      # following), stops the ramp - torque stays on, the last goal is kept, the measured
      # pose is NOT written (that would lower the arm again).
      # TO-VERIFY: 0.75 mm - above the largest change one tick of reading noise on every
      # servo at once can make (offline model, incident neighbourhood, audit r11b:
      # gripper link 0.71, TCP 0.65, limb5 0.51 mm), below a limb2 sag of 3 ticks
      # (~0.9-1.0 mm of limb5 height).
      ground_recovery_sag_tolerance_m: 0.00075
      # Self check, second stage: a box overlap of two arm links is confirmed or cleared
      # on the convex hulls of their visual meshes (GJK). Coordinator decision
      # 2026-10-07 against the limb1/limb3 box artefact.
      mesh_hull_stage: true
      # Body check, second stage (robot test 2026-10-20: limb3 3.1 mm from the chassis
      # on the boxes, ~42 mm mesh to mesh, leader stuck). A box overlap of an arm link
      # with a body box rigidly fixed to base_link - chassis, arm pedestal, lidar when
      # fitted - is confirmed or cleared on the convex hull of the link's DECIMATED
      # visual mesh (not the CAD part) against the unchanged body box, with the hull's
      # own certified motion bound. Wheels, steering modules and ground: boxes only.
      # Independent of mesh_hull_stage.
      body_hull_stage: true
      # Clearance of the arm hull from a body box in that stage. User decision D1 = (b),
      # 2 mm hull-only (SR-17 rule 4(b)); 2 mm keeps the old box-padding minimum; the
      # value stays TO-VERIFY until calibration and decimation error are measured. The pedestal and lidar boxes carry 0 mm padding of their own.
      # Double parameter: a decision of zero must be written 0.0, not 0.
      body_hull_clearance_m: 0.002

      # How the wheels are modelled (SR-17 rule 4 (b)). User decision 2026-10-07:
      #   measured (default) - /hw/steer_states while fresh: each wheel only at its
      #              current angle +- steer_motion_margin_rad. Stale topic, a reading
      #              outside the mechanical stops, or an exact 0.0 (steer_servo_node's
      #              value for a dropped channel; a wheel truly at centre is swept too)
      #              -> that wheel swept over its MECHANICAL stops. NOT detectable: the
      #              node publishes the COMMANDED angle for a servo it failed to read.
      #   swept    - every wheel swept over its mechanical stops (the original SR-17
      #              4(b) wording; covers limp steering after a restart).
      wheel_envelope: measured
      steer_states_topic: /hw/steer_states
      steer_state_timeout_sec: 0.5          # TO-VERIFY (measured mode only)
      steer_motion_margin_rad: 0.0873       # TO-VERIFY, 5 deg (measured mode only)

      # SR-17 rule 12 (user revision 2026-10-07): the ARM parts of P (pick), I
      # (go_home) and the return home after an abort are planned and filter-checked
      # (planner below); no filter, configuration or model -> P and I refused. Gripper
      # moves (O, the open/close steps of P) are evaluated and logged, not blocked;
      # the L2 joint limit applies to their targets. No parameter changes this.
      # Calibration (arm_calibration.yaml calibration_verified) is still false; then
      # leader mode is REFUSED unless allow_unverified_calibration: true - only for the
      # first, user-approved calibration session (SR-1). Never default it to true.
      allow_unverified_calibration: false

    # Path planner (gripperx_arm.planner) for the ARM parts of P, I and the return
    # home after an abort (user decision 2026-10-07: "im Zweifel abbrechen" - no path,
    # no motion), and for leader re-alignment after a rejected setpoint.
    planner:
      # TO-VERIFY: HARD wall-clock cap on one plan (all stages incl. smoothing; overrun
      # at most one pose check). Not derived from a measurement; the node logs the time
      # each plan actually took ("path ... (N waypoints, C checks, T ms of B ms)").
      time_budget_s: 5.0
      # TO-VERIFY: wall-clock cap on one RESUMED search (audit 2026-11-02 M2/M6): a leader
      # re-plan, and the operator's I (go_home), run in slices of time_budget_s, a cut
      # slice resumed with the same checks; past this total (sum of the slices, overrun
      # at most one slice) the search fails closed - leader: the arm holds, the failure
      # is reported on /arm/safety_filter/status and not searched again until leader,
      # held pose or envelope change; I: NO_PATH, nothing moves. Automatic motions keep
      # one slice. Not derived from a measurement (Pi 2026-11-05: one leader direct-path
      # check took 176-538 ms; max_checks alone allows minutes).
      max_search_s: 30.0
      # TO-VERIFY: the operator's I re-reads the present positions after its search and
      # before its first write (audit 2026-11-02 S1); a limb servo more than this many
      # ticks from the planning read refuses I, nothing written (the path would start
      # where the arm no longer is). 2 = one tick of reading noise plus one, as
      # safety_filter.ground_recovery_start_drift_ticks; not measured for this use.
      start_drift_ticks: 2
      # TO-VERIFY: deterministic work bound (path checks of direct + detour + RRT;
      # smoothing adds at most 60). Same inputs -> same path while the time cap does
      # not bind.
      max_checks: 600
      rrt_step_rad: 0.25                # TO-VERIFY: RRT edge length (largest joint)
      seed: 0                           # deterministic RRT
      max_joint_velocity_rad_s: 0.5     # TO-VERIFY: speed on a detour (direct paths keep
                                        # the sequence's own move time)
      # SR-17 rule 11 - USER DECISION 2026-10-08 (option a), until the gripperx-safety
      # audit and the OP-43 decision. AUTOMATICALLY triggered arm motions - the return
      # home after an abort, the re-plan from the measured pose inside a running pick,
      # a pick triggered by the external-goal gateway, startup homing - take the
      # DIRECT path only: blocked -> P refused, return home / re-plan hold and report.
      # Detours (joint-ordered, RRT-Connect) only for P and I commanded by the operator.
      #   direct_only - the decision (locked; also the code default)
      #   detour      - detours for automatic motions too; needs the audit + OP-43 first
      # Which P is the gateway's: arm_action_server._pick_trigger (fail-closed).
      automatic_paths: direct_only
      # SOFT START (user decision 2026-10-20). The safety filter checks the start of every
      # motion grown by its FIRST step's motion bound (SR-17 rule 5): a full leader step
      # (0.8 rad/s / 30 Hz = 0.0267 rad on limb2) costs ~6 mm of limb5 clearance there, the
      # return home's first ramp step ~11 mm - so a start 10-21 mm above the ground was
      # refused although the motion leads upward. The segment that leaves a path's start
      # therefore begins with these fractions of a full step (leader re-plans: of
      # leader.max_joint_velocity_rad_s / rate_hz; the automatic return home: of its ramp
      # step), then full steps; the planner validates exactly these setpoints and the
      # executor writes them (gripperx_arm.exec_steps.soft_start_fractions). Applies to
      # leader re-plan paths, the automatic return home (still direct path only, no
      # ground recovery) and - user decision 2026-10-20, robot test that day: the
      # operator's I from a held pose 3.1 mm (padded boxes) off the chassis was refused
      # at sub-step 0 by its first full step, offline it passes soft-started - also to
      # the operator's I (go_home) and to both arm paths of P (pick_plastic: approach and
      # return home, as planned and as re-validated from the measured pose). A segment
      # that lifts out of the ground margin takes full steps instead (planner
      # starts_soft). Not to the leader's direct steps. Each value in (0, 1];
      # [1.0] = no soft start. Growth model and ground margin unchanged.
      # TO-VERIFY: the diagnosis proposal of 2026-10-20, not measured on the robot. Derived
      # from the profile, not measured: its five setpoints cover 1.75 full steps, so a path
      # gains 3-4 setpoints (~0.10-0.13 s at 30 Hz).
      soft_start_step_fractions: [0.05, 0.15, 0.3, 0.5, 0.75]

    abort:
      # USER DECISION 2026-10-07 (confirmed value). After an abort (cancel, gateway
      # disarm, leader watchdog, J) the arm returns home after this grace; a Space stop
      # or an O/I/P command arriving within it takes precedence (they reach the node on
      # other topics, order not guaranteed).
      home_grace_sec: 0.5

    hold:
      # USER DECISION 2026-10-13 (option a, verbatim "Mach für 3 a"; SR-17): with torque
      # on, a hold (every leader exit except Space, a refused return home, a refused or
      # failed P / command after motion started) KEEPS the last written goal of each
      # servo instead of writing the measured pose - re-writing a sagged measured pose
      # lowered the arm step by step on 2026-10-12 (limb5 8.5 -> 7.5 -> 3.1 -> 1.2 mm).
      # Exception per servo: |present - last goal| above this many ticks counts as
      # contact/obstruction - that servo's goal := its present position (it stops
      # pushing); the others keep theirs. If the kept LIMB goals fail the filter under
      # the current envelope - checked as the gap motion from the measured pose, which
      # must pass too (a wheel moved into them, a replaced model) - every servo is held
      # at its measured position instead. A gripper squeezing up to this many ticks
      # short of its goal keeps squeezing. The operator's I and leader mode start from
      # the kept goals as well (arm_action_server._held_start). Space on a held arm
      # with a servo beyond POS_TOLERANCE (80) of its goal turns the torque off
      # (user decision 2026-10-13, "Bei Leertaste fuer Servos a").
      # TO-VERIFY (not measured as a contact value): 100 ticks (8.8 deg). Above the
      # largest lag measured 2026-10-13 (limb2 present - goal 11..60 ticks, growing over
      # six setpoints of an operator I) and above POS_TOLERANCE (80 ticks, the node's
      # own "target reached" tolerance), so a servo merely lagging under load is not
      # re-anchored; below leader.command_tolerance_rad (0.35 rad = ~228 ticks), at
      # which leader mode already ends. A blocked servo keeps pushing with up to this
      # error before it is re-anchored - the force that implies is not measured.
      contact_threshold_ticks: 100

    stop:
      # Space (/arm/stop) waits at most this long for the arm bus (2026-10-13 robot
      # event: one bus read that hung held the serial lock; Space must never wait behind
      # it). Not free in time: the stop flags are set at once (a ramp ends at its next
      # setpoint check) and the torque-off becomes PENDING - applied by the next bus
      # access, retried every 50 ms and by every later Space; logged as TORQUE OFF
      # PENDING. TO-VERIFY: 0.1 s, against the normal worst case of one 6-servo read
      # cycle (a few ms at 1 Mbaud) and servo_bus.TXN_MAX_S (0.25 s per transaction).
      lock_timeout_sec: 0.1

    bus:
      # 2026-10-13 18:09: the arm's USB serial adapter re-enumerated (ttyACM -> ttyACM3)
      # and the node never reopened the port. On the first I/O error the bus counts as
      # LOST: every motion is refused, torque state and goals are unknown, Space becomes
      # a pending torque-off; /dev/arm_servo (the udev symlink) is reopened this often
      # and accepted once every servo answers. Nothing is written on reconnect. Working
      # value, not measured.
      reconnect_period_sec: 1.0
      # TO-VERIFY on the Pi (first value tried, laptop only). How long a Python thread may
      # keep the interpreter while another waits (sys.setswitchinterval, default 5 ms),
      # applied only for the length of each bus call. The path search is pure Python in a
      # thread: every bus transaction gives the interpreter up many times and waited behind
      # it each time (robot 2026-11-02: read_s up to 0.67 s of a 33 ms tick, 1.5 s tick
      # period). The SDK's reply timeout (~34 ms) is wall clock, so such a wait can also
      # fail a read whose reply is already there. Real SDK on a pty, one search thread,
      # 12 s, process-wide: 5 ms 6 misses of 408 reads, p95 92 ms; 0.5 ms 0 of 1044, p95
      # 16 ms; no search 0 of 2394. Process-wide it starved the search instead.
      python_switch_interval_s: 0.0005

    # SR-17 rule 2 (EEPROM read-back before torque-on). USER DECISION 2026-10-07:
    #   log     - until the FIRST CALIBRATION SESSION: registers read and logged only.
    #   enforce - after that session (L1 limits written with arm_eeprom_limits): torque
    #             stays off until every servo's limits equal the computed L1 values.
    # Switch to enforce in the same change that records the calibration session.
    eeprom_check: log
    # L1 margin, TICKS per servo id [1..6], added OUTSIDE the computed software limit:
    # min side (lower tick) / max side (higher tick) - tick space, not angle space (a
    # joint with sign -1 has its upper ANGLE on the min side). The ONE source for
    # arm_eeprom_limits (what it writes) and for eeprom_check: enforce (what the node
    # compares). Changing a value after a write makes enforce refuse torque until the
    # servos are re-written.
    # USER DECISION 2026-10-13 ("EEPROM 1-5 wie empfohlen"); values TO-VERIFY until the
    # write session. Rule: each EEPROM limit ~1 deg (11 ticks) inside the measured
    # mechanical stop (gripperx_geometry arm_joint_stop_lower/upper), capped at 45 ticks
    # (~4 deg) beyond the software limit; 0 where the software limit is the stop itself
    # (limb3 lower angle = max side: 3082, 1 tick inside the stop at 3083; gripper close =
    # min side: 1314, 1 tick PAST the close stop at 1315, because the limit is rounded
    # outward - not "1 deg inside" on these two sides). Binding constraint: the
    # limp rest pose measured 2026-10-09, ticks [2089, 834, 3071, 1463, 2116, 2651],
    # must lie inside the range, or the next boot's goal := present torque-on is clamped
    # (a jump). limb2 min side 828 keeps only 6 ticks to that rest value: re-measure the
    # rest pose after a few power cycles (user decision 2026-10-13).
    # Resulting EEPROM ticks: id1 794..3342, id2 828..3202, id3 881..3082,
    # id4 916..3185, id5 339..3957, id6 1314..2762 (arm_eeprom_limits prints them).
    eeprom_margin_min_ticks: [45, 45, 45, 45, 45, 0]
    eeprom_margin_max_ticks: [45, 44, 0, 44, 45, 44]

    # /arm/state at_home (the goal gateway's ARM_NOT_HOME dispatch gate) - audit AP3 F1.
    # USER DECISION 2026-10-13 ("Für den Greifer ist a gut"): false = variant a,
    # limb1..limb5 only - after a successful P the litter stays in the jaws and must not
    # block the mission; the gripper is reported separately (gripper_at_home).
    # true = variant b: limbs AND gripper.
    arm_state:
      at_home_includes_gripper: false

    leader:
      rate_hz: 30.0                         # TO-VERIFY, = leader_arm_node rate_hz default
      # TO-VERIFY (FR-17 item 5): leader mode switches off and the arm holds when no
      # heartbeat / joint_states arrived for this long (robot monotonic receive time).
      watchdog_timeout_sec: 0.3
      # FR-17 item 4: per-joint leader-vs-follower match required to ACTIVATE leader
      # mode. User decision 2026-10-12 ("Können wir die Toleranz der Abweichung von
      # Leader und Arm auf 10° erhöhen?" - option a): 10 deg, a decided value. The
      # mismatch is then closed by the leader tick at max_joint_velocity_rad_s, never
      # jumped - operator note: right after J the follower moves up to 10 deg on its own,
      # max_joint_velocity_rad_s / rate_hz per tick (0.8 / 30 = 0.0267 rad, ~0.22 s for
      # 10 deg), while the leader is held still.
      # (Until 2026-10-12 one match_tolerance_rad: 0.10 served both roles.)
      activation_match_tolerance_rad: 0.174533
      # Replan-repeat gate (not a match): a failed background search is not repeated,
      # and a running one is cancelled, only once the leader target or the held pose
      # moved by more than this (per joint). Kept at the former 0.10 rad, TO-VERIFY.
      replan_repeat_tolerance_rad: 0.10
      # TO-VERIFY (FR-17 item 8, OP-42 (f) "slow"): per joint. Raised 0.3 -> 0.5 on
      # 2026-10-15 as the first step of a staged increase (user: "a, mit 0,5 rad/s
      # anfangen"; = planner detour speed). Raised 0.5 -> 0.8 on 2026-10-16, user
      # decision ("direkt 0,8 und aufzeichnen"): straight to 0.8, the robot test recorded
      # (gripperx_leader record_follow with leader.follow_debug_enabled: tick time,
      # rate-limit lag and servo lag, limb2 near the ground). Next step (1.0) only after
      # that recording is evaluated.
      max_joint_velocity_rad_s: 0.8
      # After a rejected setpoint the arm holds; once the leader's pose is valid again a
      # path to it is searched IN THE BACKGROUND: the leader tick, its watchdog and its
      # refusal checks keep running, but not at their rate: the search competes with them
      # for the interpreter (audit of 2026-11-02, laptop, during a search: tick p95 ~200
      # ms, max 276 ms, against 33 ms nominal; Pi TO-VERIFY). The search runs in slices of
      # planner.time_budget_s; a slice cut by that cap is resumed, not restarted, also
      # inside a path check - except a check with state (a link rising out of the ground
      # margin, a self pair separating), which starts over and, if longer than a slice,
      # can still stall. The whole search is bounded by planner.max_checks (and ends early
      # when one slice gets past no pose at all). Its progress is published on the leader
      # state. A search
      # with no path is reported once and not repeated until the leader target or the
      # held pose moves by more than replan_repeat_tolerance_rad, or a steering wheel's reading
      # could free space (a wheel newly known, or moved by more than
      # safety_filter.steer_motion_margin_rad; a wheel going stale cannot); a running
      # search whose leader target or held pose moved that far is cancelled.
      # (Until 2026-10-08 a separate replan_time_budget_s: 1.0 capped a search that ran
      # ON the tick; it could not find the chassis detour and retried the identical
      # search every replan_period_sec forever. Removed.)
      # TO-VERIFY: minimum interval between two search starts.
      replan_period_sec: 0.5
      # TO-VERIFY (SR-17 rule 8): leader mode ends (arm returns home) when the measured
      # pose differs from the last commanded one by more than this, on any leader joint.
      # The gripper (driven since 2026-11-13) only on its OPENING side: jaws stopped by an
      # object while CLOSING keep leader mode, whatever the gap (user decision 2026-11-16,
      # FR-17 amendment); they press with the force below. Grasping untested on the robot.
      command_tolerance_rad: 0.35
      # Hook for the gripper's own Torque_Limit in leader mode (register 48, RAM, servo 6
      # only; the EEPROM is never written). UNSET (user decision 2026-11-16 (a)): the
      # gripper runs at the servo's own Torque_Limit, like limb1..limb5 - this node writes
      # no Torque_Limit for any servo. Set (1..1000, never raised above the servo's present
      # value): written when leader mode starts driving the gripper, the previous value
      # restored on every exit and before every O/P/I; write or read-back failed -> the
      # gripper is held for that session, the limbs follow. TO-VERIFY: the value is to be
      # measured on the robot (FR-17 amendment 2026-11-16); no value until then.
      # gripper_torque_limit:
      # Command margin at the joint limits (user decision 2026-10-15, robot finding
      # 15:17:04: limb2 led to its lower limit -3.3427 rad, commanded exactly there, sagged
      # 1 tick beyond -> the measured-pose check above (SR-17 rule 8) ended leader mode;
      # holding at a limit was impossible). Every leader setpoint - the direct steps, the
      # re-plan target and its RRT samples - is kept this many WHOLE servo ticks inside
      # each joint limit (gripperx_arm.leader_band; 2 pi / ticks_per_rev per tick from
      # arm_calibration.yaml). The joint limits and the measured-pose check are NOT changed.
      # A joint activated inside the margin (the CAD home has limb3 8 ticks above its
      # lower limit) is neither pulled in nor commanded further out: its edge is where it
      # is held until the leader takes it inward. A leader value that crossed its angle
      # window edge is still rejected (checked before the clamp). Since 2026-11-13 the
      # gripper is driven by the leader like limb1..limb5 (user decision, FR-17) and has
      # this band too. gripperx_leader's virtual wall reads this key too.
      # TO-VERIFY: 10 = the user's start value 2026-10-15 (sag measured that day: 1 tick at
      # the limit, 5 ticks by the return home); not yet tested on the robot.
      limit_command_margin_ticks: 10
      # Slowdown toward the command band edges (user decision 2026-10-16, robot finding
      # that day at 0.8 rad/s: limb2 led fast downward reached its band edge at full
      # speed, the servo overshot by momentum to -3.3456 rad, 2 ticks beyond its lower
      # limit -3.3427 despite the margin above -> the measured-pose check (SR-17 rule 8)
      # ended leader mode). A joint moving TOWARD an edge closer than
      # edge_slowdown_zone_rad brakes with constant deceleration from
      # max_joint_velocity_rad_s at the zone start to edge_slowdown_velocity_rad_s at the
      # edge (gripperx_arm.leader_band.edge_speed; with 0.8 / 0.15 / 0.2: 2.0 rad/s^2,
      # 0.66 rad/s at 0.10 rad, 0.49 at 0.05, 0.35 at 0.02). The distance is the smaller
      # of setpoint and measured pose. The whole step is scaled, so its direction is kept;
      # moving away from an edge is never slowed. Planned re-plan paths brake the same
      # way along each segment (setpoint distance; audit ES1 H1), their steps validated
      # as written. Zone 0 = off; the slow speed must be at least one servo tick per
      # leader tick (2 pi / 4096 * rate_hz = 0.046 rad/s at 30 Hz; slower, the arm would
      # freeze) - otherwise leader mode is refused. Joint limits, band and checks are
      # unchanged.
      # TO-VERIFY: both values are the user's start values of 2026-10-16, not yet
      # tested on the robot.
      edge_slowdown_zone_rad: 0.15
      edge_slowdown_velocity_rad_s: 0.2
      # Per-tick diagnostics on /arm/leader/follow_debug (gripperx_arm_msgs/LeaderFollowDebug,
      # best effort) while leader mode is active: setpoint, clamped leader target, the
      # positions the tick read, tick duration and period, outcome, and (2026-10-16) the
      # time per tick phase (read, checks, write, ...). Published after the
      # servo write; a failure there never ends leader mode. Added 2026-10-16 to find what
      # limits the follow speed (recorded by gripperx_leader record_follow). TO-VERIFY:
      # on by default; costs one small message per tick on the Pi.
      follow_debug_enabled: true
      # O/I and the operator's P while leader mode is active (user decision 2026-10-09):
      # the keyboard teleop sends the leader disable and the command on two topics, in
      # no guaranteed arrival order. A command refused ONLY because leader mode is on
      # waits up to this long for it to switch off, then claims the arm (which cancels
      # the leader exit's return home). Space during the wait refuses; still on after
      # it -> refused. A gateway-triggered P never waits. Only one command waits at a
      # time; a second one meanwhile is refused at once (audit r8: waiters held the
      # executor threads and delayed Space). Any command received before a Space that
      # has been handled is refused (DDS receipt order, not callback order; no time
      # window involved). TO-VERIFY: 0.3 s against the teleop's real
      # disable-to-command gap.
      command_wait_sec: 0.3
      # While leader mode holds (a rejected setpoint, a search running or recorded as
      # failed, an invalid leader target) a status line - holding since, why, the measured
      # lowest ground clearance, the binding refusal (kind and pair of the last REJECTED
      # verdict) and the largest held goal - measured lag in ticks with its growth - is
      # logged this often (user decision 2026-10-20: a hold
      # is never silent; one held 7.5 min without a log line). Working value.
      hold_status_period_sec: 5.0
      # A re-plan path found but discarded because its first step is refused from the
      # measured pose (the arm lags its held goals) is not a failed search. It is looked
      # at again only once a limb servo moved by MORE than this many ticks from where it
      # was discarded (or the leader / held pose / envelope changed): then the cached path
      # is re-checked from the new measured pose (a path that lifts out of the ground
      # margin is searched again). Below it the arm holds - one tick of reading noise
      # restarted the identical search every replan_period_sec (audit 2026-10-20).
      # Separate from safety_filter.ground_recovery_start_drift_ticks on purpose: that one
      # is a safety guard of a lift, this one only throttles re-checks.
      # TO-VERIFY: 2 = one tick of reading noise plus one, not measured on the robot.
      # Also used, while the lag-growth gate is closed, as the LEADER move that starts a
      # new search after a path the gate refused (in radians of one tick each). Leader
      # reading noise above 2 ticks would restart that search every replan_period_sec.
      # TO-VERIFY: the leader arm's reading noise is not measured.
      replan_discard_move_ticks: 2
      # Held-goal ratchet stop (robot test 2026-10-20). Seen that day: each re-plan from
      # the held goals wrote its soft first step, its next step was refused from the
      # measured pose (the arm lags it), and the next search started from goals one step
      # further away - limb2 goal - measured grew 8 -> 13 ticks while the arm did not move.
      # This gate acts on the GROWTH of the per-joint setpoint - measured deviation, not
      # the deviation itself (user decision D2 (2026-10-23)). The gate closes while any
      # limb's |servo goal - measured| has grown by more than this many ticks since its
      # baseline (against the smallest value seen) AND its goal has itself moved away from
      # the arm by more than this since that value: counted is the smaller of the two
      # (user decision 2026-10-30). A sag alone closes nothing: with a fixed goal it would
      # lock the arm near the ground, where the only way a gated joint may go is down. The
      # ratchet always needs goal travel; for an arm that does not move, growth and travel
      # are the same number. Judged against the goals the servos HOLD, not the start of
      # the next re-plan (a gate judged by that start went blind - audit 2026-10-29). Per
      # joint, the baseline is taken at the first leader tick after activation and moves
      # only where the joint followed its goals by more than its deviation grew plus this
      # (a joint sagging away from its goals never re-baselines, nor does one joint
      # tracking reset another); at any leader tick a joint whose arm moved more than this
      # and whose deviation is back within the reopening threshold of its reference moves
      # the origin of the travel (a followed move does not count against a later sag). A
      # sag during the move still can lock (user decision 2026-10-30). A direct leader step written or a path completed does NOT reset it (a
      # direct step 17 ticks off a stuck arm did, and re-plans ran the goals to 31 ticks
      # cycle after cycle - audit 2026-10-29). The deviation itself is not limited: at
      # rest limb1-4 sit 5-9 ticks off their goals and re-plans from there recover (audit
      # 2026-10-20, recordings of 2026-10-16/20).
      # While the gate is closed (user decision D3 (2026-10-23)), searches run as usual but
      # a found path is adopted only if its first goal change brings the goals closer to
      # the measured arm: no limb's |goal - measured| larger than its servo goal's (a
      # joint the gate does not hold: than the larger of that and its reference + the
      # reopening threshold), no goal of ANY joint crossing to the other side of the
      # measured arm (user decisions 2026-10-29/30; landing exactly on the reading is
      # allowed, and a held goal within the noise band of the reading has no side), at
      # least one gated joint's strictly smaller, every changed goal toward the leader
      # target as it is at adoption and not past it - and every later goal change of
      # that path stays within that bound.
      # What this guarantees: NO GROWTH WHILE THE GATE IS CLOSED. The gate is judged at
      # hold ticks only, so this limit is not a bound on the deviation at all times: after
      # it reopens, one path or a run of direct steps can overshoot it until the next hold
      # (seen: 12 ticks at a limit of 4, audit 2026-10-29). That is no ratchet: the
      # reference stays where it was, so that hold closes the gate again and the deviation
      # does not build up from cycle to cycle. Elsewhere only the filter and
      # command_tolerance_rad bound it. The goals are never pulled back to the measured
      # pose as such (that re-anchoring lowered a loaded arm hold by hold, 2026-10-12):
      # they move only along a planned path toward the operator's leader target, which
      # starts at the held goals, checked as a static pose, or does not start (user
      # decision 2026-10-30, _held_start). Gated, the arm says so (once per closing, at most once per
      # hold_status_period_sec, then the hold status line). Other ways out: the arm
      # moves, I (planned from the held goals) or J. While the gate is closed, a direct
      # leader step is held to the same bound (no goal further from the arm, none across
      # it) until the next hold judges the gate again.
      # 0 and 1 cannot start: replan_lag_gate_noise_ticks must lie strictly between 0 and
      # this value, so the smallest value that starts is 2 (checked at startup).
      # TO-VERIFY: 4 = user decision 2026-10-20, provisional - the growth semantics are
      # confirmed (D2 (2026-10-23)), the value is not.
      replan_max_goal_lag_growth_ticks: 4
      # Servo position reading noise assumed by the lag-growth gate, ticks (an integer,
      # 0 < this < replan_max_goal_lag_growth_ticks, checked at startup): a closed gate
      # opens again only at a growth of (replan_max_goal_lag_growth_ticks - this) or
      # less, and the D3 (2026-10-23) shrink rule above must hold for every arm position
      # within this many ticks of the reading (a goal crossing the arm could otherwise
      # pass on noise).
      # TO-VERIFY: 1 = the one tick of reading noise assumed for replan_discard_move_ticks,
      # not measured on the robot.
      replan_lag_gate_noise_ticks: 1
      calibration_verified_topic: /arm/leader/calibration_verified
      arming_state_topic: /gripperx/external/arming_state

    # Aimed P (FR-16 stage 1, USER DECISIONS 2026-10-13): PickPlastic with `aimed: true`
    # grasps at P's grip height (the TCP height of poses.grip above, through the active
    # calibration and URDF - not a value here) but at the target's (x, y), gripper
    # VERTICAL, wrist roll free. Without `aimed` P is the fixed P, unchanged.
    aimed:
      # false: aimed goals are refused (AIMED_UNAVAILABLE), no TF listener, no region.
      enabled: true
      # USER DECISION 2026-10-13 (option b): gripper vertical = 0. (P's taught grip pose
      # is tilted ~30 deg; the IK takes any tilt, > 0 leans the jaws back toward limb1.)
      tilt_deg: 0.0
      # USER DECISION 2026-10-13: the wrist roll (limb5) is free. Searched in this order,
      # relative to P's grip roll; values outside the joint limit are skipped. The chosen
      # roll is logged. Bounded set, not a measurement.
      roll_offsets_deg: [0.0, 30.0, -30.0, 60.0, -60.0, 90.0, -90.0, 120.0, -120.0, 150.0, -150.0, 180.0]
      # Static-checked candidates the planner tries before NO_PATH (each costs one plan).
      max_candidates: 4
      base_frame: base_link
      # The max age of the target and base-still transforms is the top-level
      # max_tf_age_sec of gripperx_arm_msgs/config/tf_freshness.yaml - ONE bound with
      # the goal gateway (SR-16 E3, audit F4 (a)); every arm launch path loads it.
      # TO-VERIFY: a transform dated further in the future than this is refused too
      # (SR-16 E3 draft: stale, missing or future-dated = STALE_TF). Clock jitter margin.
      max_tf_future_sec: 0.05
      # Frames a target may be given in (audit AP1 L3); any other is INVALID_TARGET.
      target_frames: [map, odom, base_link]
      # Base-still check (FR-16 item 7) before the first motion and before the approach:
      # the base pose in still_frame may not have moved more than these since the start,
      # and its TF stamp must have advanced (a frozen transform reads as still). A known
      # steering reading may not change by more than safety_filter.steer_motion_margin_rad
      # (the margin the grasp pose was checked with). The arm node has no wheel-speed
      # signal; still_frame's transform is the drive evidence. A wheel read at the start
      # whose reading is lost later (topic stale, channel 0.0) counts as moved (audit N1).
      still_frame: odom
      # /tf reader queue (KEEP_LAST). A reader that falls behind reads the oldest queued
      # message, so the backlog is up to depth / rate: 100 at the robot's ~100 msg/s
      # (2026-11-09) made the base pose ~1 s old (STALE_TF). 10 bounds it to ~0.1 s; a
      # dropped message only costs freshness, the age is still taken from the stamp.
      tf_queue_depth: 10
      # The intake drains both TF queues this often (no executor: one GIL wake-up per
      # poll, not per message). Adds at most this much to a transform's age.
      tf_poll_period_sec: 0.02
      # TO-VERIFY: both mirror the gateway's settle step (5 mm, 0.5 deg between two
      # samples); not measured on the robot. USER DECISION 2026-11-05: accepted as the
      # starting values; they stay TO-VERIFY until confirmed on the robot.
      still_max_translation_m: 0.005
      still_max_rotation_rad: 0.0087
      still_min_stamp_advance_sec: 0.05   # guard margin, as the gateway's settle step
      # The allowed region is a diagnostic grid of the exact per-target test. With
      # region_at_start true it is derived in the background once the filter is built and
      # published latched (JSON) on region_topic. Laptop: 0.02 m ~4 s, 0.01 m ~31 s single
      # core; Pi not measured. USER DECISION 2026-11-05 (FR-16 item 5): false on the
      # robot - the boot derivation competes with the servo bus reads for the GIL (the
      # 2026-11-02 starvation class); derive it offline with `ros2 run gripperx_arm
      # arm_aimed_region`. The per-target check at each P does not depend on it.
      region_at_start: false
      region_step_m: 0.02
      region_topic: /arm/aimed/region
      # SR-16 E4 / E12 (d): inward margin of the allowed grasp region (the horizontal TCP
      # calibration error), metres. A target is accepted only if every point within this
      # distance of it (sampled at region_step_m) is in the region too; else OUT_OF_REACH.
      # Startup-only, NO code default. Set: applies to every aimed goal. Unset (or not
      # finite / negative): no margin for the confirm_by_rearm preview and confirmed pick
      # and the operator's aimed P (E4: none while only the interim mode runs); any other
      # aimed goal (mode automatic) is refused (AIMED_UNAVAILABLE). Fixed P unaffected.
      # 0.0: prototype assumption, TO-VERIFY, user decision 2026-11-16, not measured
      # (E12 (d) owed).
      region_margin_m: 0.0
      # USER DECISION 2026-11-16: steep approach from above. The approach ends at a
      # PRE-GRASP pose pregrasp_height_m vertically above the grasp pose (same x, y,
      # tilt and wrist roll, gripper open); a vertical descent reaches the grasp; after
      # the close the arm lifts back up the same line (if that passes the checks) and
      # returns home. A target counts as in the allowed region only if the pre-grasp
      # pose and every descent waypoint have an IK of the grasp's branch with the same
      # roll that passes the static check (SR-17 rule 4) - the region shrinks.
      # Startup-only, NO code default: any of the three missing / not finite / <= 0 (or
      # descent_step_m > pregrasp_height_m) -> every aimed P is refused
      # (AIMED_UNAVAILABLE). Fixed P unaffected.
      # 0.10: the user's value 2026-11-16, TO-VERIFY on the robot.
      pregrasp_height_m: 0.10
      # Cartesian waypoints of the descent at most this far apart (IK at each height,
      # same branch and roll); each is static-checked, each segment between them is
      # checked as a planned path segment (written setpoints). Design value, not a
      # measurement, TO-VERIFY.
      descent_step_m: 0.01
      # The joint-linear motion between two waypoints may leave the vertical line by at
      # most this (TCP, horizontal, sampled every 2.5 mm); else that candidate fails.
      # Design value, not a measurement, TO-VERIFY.
      descent_max_lateral_m: 0.002
