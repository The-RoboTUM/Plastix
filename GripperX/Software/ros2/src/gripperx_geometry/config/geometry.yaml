    decimals: 4
    unit: metre
    provenance: derived
    date: 2026-10-20
    status: accepted
    coupled_to: base_footprint_to_base_link_z
    derived_from: |
      x, y = 0: IMU centre directly above the base_link origin (user, from the
      Onshape model, 2026-10-20). z = user-given height of the IMU centre above
