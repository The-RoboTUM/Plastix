  chassis_box_padding:
    value: [0.003, 0.003, 0.003, 0.000]
    decimals: 3
    unit: metre
    provenance: decision
    date: 2026-10-13
    status: accepted
    decision:
      question: |
        How much margin does each CAD-derived chassis box carry against the
        built robot? (10 mm on every box, the first proposal, refused the
        measured arm resting pose: limb2's box rests 3.3 mm above the unpadded
        pedestal top, so the arm could not return home from rest.)
      by: user
      date: 2026-10-13
      quote: '"Fahrwerk Puffer b mit 3mm halte ich für sinnvoll. Die Reifen können wir so lassen." (I consider the chassis buffer, option with 3 mm, sensible. We can leave the tyres as they are.)'
      outcome: |
        Per box: bottom, lower body, upper body 3 mm on every side; pedestal
        0 mm - it is printed and part of the assembly the arm sits on (the
        GQ-4 argument), and any margin there above ~3 mm makes the resting
        pose a chassis contact. Tyres: no deformation margin.
    rationale: |
      Padding on every side of each chassis_box_*, in the order bottom,
      lower_body, upper_body, pedestal. Covers the difference between CAD and
      the built body, which "the robot matches the CAD" does not quantify. The
      arm's own boxes and body_clearance_m (arm_safety_filter.yaml) are
      separate. The tyres are not chassis_link and carry no margin (user
      2026-10-13, same quote).
    consumers:
      - gripperx_description/urdf/gripperx_v1.core.xacro::xacro:property[chassis_box_padding]

