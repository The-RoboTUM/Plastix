  # ---------------------------------------------------------------------------
  # CHASSIS COLLISION MODEL — four axis-aligned boxes in chassis_link (= base_link,
  # zero offset), replacing the single bounding box of base_link.stl
  # (0.493 x 0.330 x 0.202 m, 2026-08 .. 2026-10-13). The arm safety filter
  # (SR-17 rule 4 (b)) checks the arm against them; the visual stays the mesh.
  #
  # Each box is [x_min, y_min, z_min, x_max, y_max, z_max] UNPADDED, i.e. the
  # mesh itself. base_link.stl is the DECIMATED visual mesh (commit 2fb4202);
  # it lies within 0.6 mm of the CAD import (68e351c, 47087 triangles), which
  # sticks out of these boxes by up to 0.58 mm (upper body, y, at z ~0.0264),
  # 0.31 mm (lower body front, x 0.2481) and 0.023 mm (pedestal, x max) -
  # inside the 3 mm body padding; the unpadded pedestal is 0.023 mm short. The xacro adds chassis_box_padding (per box) on every side.
  # Method (all four): the mesh is cut into z-slabs at -0.0040, +0.0264 and
  # +0.0801; every triangle is CLIPPED to each slab it crosses and the slab box
  # is the bounding box of the clipped pieces, rounded outward to 0.1 mm. The
  # clipped pieces partition every triangle, so the union of the four boxes
  # contains the whole decimated mesh - proven by gripperx_arm
  # test/test_chassis_collision.py (every vertex, plus dense points on every
  # triangle).
  # Slab cuts sit at real steps of the mesh, never through a face:
  #   -0.0040  between the bottom piece (top vertex -0.0060) and the wide body
  #            (lowest vertex -0.0020)
  #   +0.0264  the body is 1.6 mm wider in y below z +0.0263 (highest vertex
  #            with |y| > 0.1646) and its front reaches x 0.2477 below / 0.2679
  #            above
  #   +0.0801  the lid top plane (z +0.08006) - the arm pedestal above it
  #
  # PROVENANCE: CAD mesh base_link.stl (decimated, <= 0.6 mm from the CAD
  # import), CONFIRMED AS BUILT by the user
  # 2026-10-13, verbatim (German): "Der Roboter entspricht dem CAD. Einzig die
  # Reifen können weil sie elastisch sind abweichen." (the robot matches the
  # CAD; only the tyres can deviate because they are elastic). That covers: no
  # part on the lid other than the lidar and the arm pedestal, lid height and
  # lower body as in CAD.
  # ---------------------------------------------------------------------------

  chassis_box_bottom:
    value: [-0.0960, -0.0850, -0.0800, 0.0960, 0.0880, -0.0040]
    decimals: 4
    unit: metre
    provenance: cad
    date: 2026-10-13
    status: accepted
    rationale: |
      Bottom piece under the body (z -0.0800 = lowest point of the mesh, up to
      the -0.0040 cut). [x_min, y_min, z_min, x_max, y_max, z_max] in
      chassis_link, unpadded. Method and provenance: block comment above.
    consumers:
      - gripperx_description/urdf/gripperx_v1.core.xacro::xacro:property[chassis_box_bottom]

