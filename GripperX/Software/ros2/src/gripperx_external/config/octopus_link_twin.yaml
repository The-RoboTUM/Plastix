# Octopus external-goal link - DIGITAL TWIN (ROS_DOMAIN_ID=220, SR-8).
#
# Defaults here are the ROLLOUT STAGE 1 values: telemetry only, no goal ingress,
# no action client, disarmed, dry run. Stage 2 is reached by launching with
# `goal_ingress:=true` - nothing in this file may produce an armed state, and
# nothing in it may be edited to produce one (SR-15 rule 4).
#
# Everything marked TO-VERIFY is deliberately unmeasured. The gateway REFUSES to
# validate or resolve rather than falling back to an invented number; that
# refusal is the designed behaviour, not a defect.

/gripperx/external/octopus_link_node:
  ros__parameters:
    use_sim_time: true

    # SR-8. Compared against ROS_DOMAIN_ID before anything is created; a
    # mismatch is FATAL and exits. 220 = twin. NEVER set this to 20 here.
    expected_domain_id: 220

    # The mock rosbridge (test/fake_octopus.py) by default. The real Octopus
    # host replaces this at rollout stage 4.
    url: "ws://127.0.0.1:9090"

    # Stage 1: /octopus/trash_goal and /octopus/trash_gps are not subscribed at
    # all, so no external goal can enter the process. Overridden by the launch
    # argument for stage 2.
    goal_ingress_enabled: false

    # Both their producers publish at 1 Hz unconditionally, so silence on a
    # connected socket means their stack stopped, not their traffic.
    # `TO-VERIFY` as a tuning value; 5 s = five missed publications.
    link_lost_sec: 5.0

    # Drain rate of the inbound slots. Above their 1 Hz publication rate so a
    # datum burst is picked up promptly; latest-wins in the slots is what makes
    # the burst converge instead of queueing.
    drain_rate_hz: 5.0
    status_rate_hz: 1.0

    # Ours (8192) sits below the library's (65536) on purpose: an oversized
    # frame is dropped and counted while the connection stays up, instead of
    # costing a reconnect.
    max_msg_bytes: 8192
    ws_max_size: 65536
    ping_interval_sec: 5.0
    ping_timeout_sec: 5.0
    backoff_initial_sec: 1.0
    backoff_max_sec: 30.0

    # /octopus/devices/gripperx/status - PROPOSED, their side must still accept
    # it (proposal item 1). Publishing it from day one is what would turn their
    # `goal_selection: nearest` from "nearest to the datum" into "nearest to the
    # robot".
    publish_telemetry: true
    # Local copy of the same JSON on ~/telemetry_json, for `ros2 topic echo`
    # without a connected counterpart.
    telemetry_debug_json: true
    source_name: "octopus"

/gripperx/external/goal_gateway_node:
  ros__parameters:
    # TRUE BECAUSE THE TWIN HAS GAZEBO, AND ONLY THEN (SAFETY.md F-24).
    # Every timer-driven safety mechanism in the gateway - the arming expiry,
    # the link watchdog, the cancel-confirm report, the in-flight re-validation
    # and the in-flight correlation gate - is measured on this clock. With sim
    # time and NO /clock publisher not one of them fires, so this value is a
    # statement that a /clock exists. Running the twin stack against mocks
    # instead of Gazebo (as the acceptance suite does) is `use_sim_time:=false`
    # on the command line. Either way the gateway now says which clock it is on
    # at startup, refuses to arm while that clock is not advancing, and disarms
    # if it stops - so getting this wrong is loud instead of silent.
    # It is startup-only: a `ros2 param set` on it is REFUSED.
    use_sim_time: true

    expected_domain_id: 220
    goal_ingress_enabled: false

    # SR-15 rule 4: this only ever PERMITS a later explicit SetArming call. It
    # can never BE the arming. Even with it true the node comes up disarmed.
    #
    # TWIN ONLY. Startup-only (a `ros2 param set` is refused), which is why
    # it is set here and not at run time. It does not arm, does not dispatch
    # and does not relax `dry_run` - the node still comes up DISARMED and an
    # explicit, time-bounded SetArming call is still the only way into an
    # armed window. `octopus_link_real.yaml` stays false.
    allow_arm: true
    # Second, independent block on dispatch.
    dry_run: true
    # SR-16 condition 5. Both conditions must hold at run time: armed AND
    # auto_pick - the arming act is the authorising step for /pick_plastic,
    # and the node additionally reports `auto_pick_available` false whenever
    # no /pick_plastic server is discovered. The twin model has the arm links
    # but no twin launch starts a pick server, so with this true nothing moves
    # against the plain twin - only the DECISION LOGIC is exercised; a mock
    # pick server (test/mock_motion_servers.py) makes the success path
    # testable.
    #
    # False by default: their targets are LIVE DETECTIONS, and a successful
    # pick publishes trash_goal_done, which marks real litter collected in
    # their system IRREVERSIBLY. With auto_pick false the gateway drives,
    # reports REACHED, and acknowledges nothing - their mission then stalls,
    # which is the honest and reversible outcome. Set true only against
    # fake_octopus, or deliberately.
    auto_pick: false
    # There is deliberately NO parameter here that could make an arrival
    # acknowledge. trash_goal_done follows a successful PickPlastic result and
    # nothing else (SAFETY.md C-7; FR-12 item 7's weaker "acknowledge on
    # reach" branch is aligned to it) - until Octopus adds a failure channel,
    # a run with auto_pick false leaves their mission stalled rather than
    # acknowledging early.


    # SR-15 rule 5: default 120 s, hard maximum 600 s. The ceiling is
    # enforced in code and cannot be raised from here. A request above it is
    # REJECTED, not clamped.
    arming.max_duration_sec: 600.0
    arming.max_consecutive_aborts: 3

    # GEOFENCE - NO PARAMETERS HERE ANY MORE (user decision 2026-09-24). It is
    # the square of side L centred on the line midpoint and aligned with the
    # line (x, y in [-L/2, +L/2] in octopus_line), derived by the gateway from
    # the LIVE line calibration: one source, and it moves with every
    # recalibration. No calibration -> no geofence -> every goal is refused.
    #
    # WHAT IT BOUNDS is unchanged: the CHOSEN ROBOT POSE, not the object
    # (validation.py check_pose, step 9). A target outside the square may still
    # be served when its standoff pose falls inside; a target inside may be
    # refused when every approach candidate lands outside. It bounds the GOAL
    # only, never the PATH: Nav2 may drive outside the square on the way.
    #
    # The camera sees more than this - an operational hazard, not harmless
    # surplus. A target whose every approach pose falls outside is refused AT
    # VALIDATION: it never becomes a mission, never counts an attempt, never
    # reaches the blacklist. The Octopus only advances on trash_goal_done and has
    # no failure channel, so an out-of-bounds target DEADLOCKS their mission.
    # Until they bound detection or add a failure channel, the whole CAMERA
    # FIELD - not just this square - must stay clear of anything the detector
    # fires on.

    # GRASP OFFSET - bench measurement on the real robot, blocks stage 5. The
    # point in base_footprint where the fixed, unaimable pick sequence
    # actually closes. There is no kinematic model to derive it from (no arm
    # link in the URDF), so there is deliberately no placeholder: a plausible
    # number here would produce goals that look valid, drive the robot, and
    # miss.
    #
    # offset_x/y: purely longitudinal, a deliberate provisional
    # SPECIFICATION rather than a measurement - the bench procedure above is
    # still owed and still blocks stage 5. Do not present it as measured
    # anywhere.
    # USER DECISION 2026-10-13 ("bei 3a sollten wir einheitlich auf 0.371 setzen"):
    # 0.371 for EVERY pick - a user-adopted value; on 2026-10-13 it was the model-
    # derived centre of the aimed P's direct-path region at y = 0 (FR-16 revision
    # 2026-10-13). Taken knowingly although the fixed P grips at ~0.333 m by model: its
    # mismatch grows from 27 to 38 mm. Was 0.360 (a user specification). Not a
    # measurement. USER DECISION 2026-11-05 ("ja übernehme das"): 0.371 adopted again
    # after the region was re-derived on the ported branch - the re-derived centre is
    # 0.366 m (model output), within 5 mm of it (FR-16 revision block, 2026-11-05 entry).
    # USER DECISION 2026-11-11 ("1a", session AIMREL): 0.361 = the centre of the
    # aimed P's allowed region at y = 0 (0.291-0.431 m, robot tests 2026-11-09), giving
    # ~7 cm either side. Reason: stage A run 2 on 2026-11-11 arrived at +0.435 m ahead
    # (OUT_OF_REACH by 4 mm); arrivals so far 0.414-0.435 m with 0.371. Still a
    # specification, not a measurement.
    grasp.offset_x_m: 0.361
    grasp.offset_y_m: 0.000
    # Still genuinely unmeasured. Gates ONLY the post-arrival reached check -
    # never resolution: an unmeasured tolerance no longer blocks every goal
    # from resolving, it makes the reached verdict UNKNOWN, which is logged
    # loudly and never defaulted to a number. It does not enter the
    # standoff-pose computation at all.
    grasp.tolerance_m: "TO-VERIFY"
    # LIST-LOSS HOLD (goal_gateway_node `_list_loss_hold`, REQUIREMENTS.md
    # SR-16 DECIDED 2026-11-16). An EMPTY (live but empty) or STALE target list
    # does not cancel the goal in flight for this long after the mission's last
    # unique correlation, as long as no grasp was requested for the mission. The
    # arrival gate picks on an EMPTY list inside the window, never on a STALE
    # one; the acknowledgement never holds. Startup-only. TO-VERIFY or absent
    # disables the hold.
    # User decision 2026-11-16, not measured.
    correlation_list_loss_hold_sec: 15.0
    grasp.approach_candidates: 12
    # NOT IMPLEMENTED. A ComputePathToPose round trip inside the approach ring's
    # synchronous acceptance predicate would be a blocking wait inside a
    # callback, which C-2 forbids. Setting it true logs an ERROR and changes
    # nothing; making it work needs the ring restructured around a future.
    grasp.verify_path: false
    # RE-AIM AT ARRIVAL (goal_gateway_node `_start_reaim`). After the arrival
    # gate has passed and IMMEDIATELY BEFORE the pick, the gateway measures the
    # object's bearing from the pose the robot actually holds; above
    # grasp.reaim_min_deg it rotates the robot IN PLACE (a second
    # NavigateToPose at its own position, behavior tree reaim_in_place.xml,
    # nav2.yaml reaim_goal_checker) so the lateral miss becomes a range error
    # along the arm's reach, then re-runs every gate and only then picks.
    # IT IS DRIVE MOTION, gated like the approach (armed, link alive, mode
    # autonomous, validate_dispatch on the re-aim pose, cancelled by every
    # disarm). The CORRELATION is relaxed for the re-aim and the pick gate
    # after it (user decision 2026-09-29, #358: the robot at the standoff can
    # occlude the litter itself): its ABSENCE from a live Octopus list is
    # tolerated; an ambiguous match, another id or a stale list still refuses
    # (recorded in REQUIREMENTS.md SR-16 as a DECIDED block). A re-aim that times out, is rejected or is
    # refused on its pose falls back to the normal arrival gate on the pose
    # actually held and picks if that passes (user decision 2026-09-29). An
    # ABORTED re-aim, or one ended by a safety cancel, does NOT pick.
    #
    # Runtime switch-OFF, no restart or rebuild (OFF only - ON is refused at
    # runtime and needs this file plus a restart of the link nodes):
    #   ros2 param set /gripperx/external/goal_gateway_node grasp.reaim_enabled false
    # It stops FUTURE re-aims and cancels one in flight, which then ends at the
    # arrival gate on the pose reached. It is NOT a stop: to stop the robot,
    # disarm or use the E-stop.
    # true in the twin: it only exercises decision logic there (and the twin
    # keeps auto_pick false, so no arrival reaches the re-aim point anyway).
    grasp.reaim_enabled: true
    # USER DECISION 2026-09-29, not a measurement. Aim errors at or below this are picked
    # without rotating. 5.0 deg because the RotationShim's peak command for a
    # rotation of e rad is sqrt(2 * 0.5 * e) (max_angular_accel 0.5, lowered from 2.0 on
    # 2026-10-08), which is 0.30 rad/s at 5.0 deg - BELOW the 0.60 rad/s knee
    # under which this plant does not deliver commanded rate (nav2.yaml
    # min_speed_theta). At 2.0 it was 0.59 and 5.0 deg was chosen as "about
    # the knee"; that derivation no longer holds and the value is NOT
    # re-derived. TO-VERIFY on the robot: does a 5 deg re-aim start? Must stay strictly above nav2.yaml
    # reaim_goal_checker.yaw_goal_tolerance (0.035 rad = 2.0 deg), or a
    # re-aim can "succeed" without having moved. Startup-only.
    grasp.reaim_min_deg: 5.0
    # USER DECISION 2026-09-29, not a measurement. Larger aim errors are NOT rotated (the
    # arrival is then judged as it stands). Covers the 5-13 deg observed over
    # the 15 arrivals of 2026-09-29 with margin, and stays clear of ~33 deg -
    # the bearing at which a corner of the 0.600 x 0.460 m footprint would
    # sweep over an object 0.36 m ahead during the turn (derived from the
    # costmap footprint in nav2.yaml, not measured). Startup-only.
    grasp.reaim_max_deg: 20.0
    # USER DECISION 2026-09-29, not a measurement. Time from sending the re-aim to
    # cancelling it (ROS clock). Must stay below nav2.yaml
    # progress_checker.movement_time_allowance (20 s), so the gateway ends a
    # stalled rotation before Nav2's progress checker aborts it. Covers the
    # behavior-tree load, one plan and a steering slew into the rotation pose
    # (~4.5 s for 0-90 deg per the crab note in the behavior tree) with margin.
    # Startup-only.
    grasp.reaim_timeout_sec: 15.0
    grasp.reaim_behavior_tree: "gripperx_planning/config/reaim_in_place.xml"

    # Tuning values, set against the twin, none safety-defining.
    # AIMED PICK (FR-16 stage 1; SR-16 extension E1-E13 - DRAFT, safety audit
    # pending; user decisions 2026-10-13). One mode, startup-only:
    #   off              - the fixed sequence, exactly as before (default).
    #   confirm_by_rearm - interim mode (E11): after the arrival gates the arm
    #                      PREVIEWS the aimed pick (nothing moves); if it passes the
    #                      gateway DISARMS and records ONE pending pick; your next
    #                      SetArming approves exactly that pick (the re-arm is the
    #                      SR-1 per-test approval). Needs the three pending_* bounds.
    #   automatic        - refused at startup outside a simulation domain until the
    #                      audit and the user's acceptance (E12).
    # Every existing gate stays in force in mode automatic; in confirm_by_rearm
    # auto_pick and the measured tolerance do not apply (user decision 2026-10-13).
    # The aim is the DISPATCHED object position (user decision 2026-10-13, answer 2).
    grasp.aimed_pick: "off"
    # USER DECISION 2026-10-13 ("bei 3a sollten wir einheitlich auf 0.371 setzen"):
    # grasp.offset_x_m above (0.361 since 2026-11-11) is used for every pick; there is no separate aimed value.
    # USER DECISION 2026-10-13 (coordinator's proposal, accepted): warn when the latest
    # unique match of the target lies further than this from the dispatched position
    # (log only, the aim is not changed).
    grasp.aim_position_drift_warn_m: 0.10
    # confirm_by_rearm only (startup refusal while unset).
    # USER DECISION 2026-10-13 ("Werte sollten bis zu 120s alt sein dürfen").
    grasp.pending_pick_max_age_sec: 120.0
    # USER DECISION 2026-10-13 ("Dein Vorschlag passt"), TO-VERIFY until real runs: the
    # ONE pending-pick bound - the target expressed in the base frame from the
    # gateway's own pose, at the re-arm and at the send, may differ from the arm's
    # preview by at most this. Covers a moved robot and a moved estimate alike.
    grasp.pending_pick_max_target_shift_m: 0.03
    # Localisation settling before an aimed pick is judged (preview, and the confirmed
    # pick after the re-arm) - USER DECISION 2026-10-13 ("Wir müssen nur aufpassen,
    # dass die Lokalisierung vor der Prüfung genug Zeit hatte, sich korrekt
    # auszurichten"). On top of the settle step (5 mm / 0.5 deg between ticks), the
    # map -> base pose must stay within those same bounds of the window's first still
    # sample for localisation_settle_sec; a late slam_toolbox correction restarts the
    # window. Never held within the timeout: LOCALISATION_NOT_SETTLED, counted, held
    # off, no re-approach. PROPOSALS, TO-VERIFY on the robot: 1.5 s = three dispatch
    # ticks, several LD06 scans (~10 Hz) plus slam_toolbox's match time; slam only
    # matches after 5 cm / 0.05 rad of motion (localization.yaml), so a correction
    # due to the final approach lands well inside it. 8.0 s timeout = the window plus
    # the settle step's 3 s and margin. Mode off: unused.
    grasp.localisation_settle_sec: 1.5
    grasp.localisation_settle_timeout_sec: 8.0

    # ARM_NOT_HOME (audit AP1 H-pre, user decision 2026-10-13 option a): no
    # NavigateToPose unless the newest /arm/state (gripperx_arm_msgs/ArmState, latched,
    # 2 Hz) says idle AND at home and is at most arm_state_max_age_sec old. TO-VERIFY:
    # 2.0 s = four periods. dispatch_requires_arm_home may be false ONLY in a simulation
    # domain (startup refusal elsewhere).
    arm_state_topic: "/arm/state"
    arm_state_max_age_sec: 2.0
    # Hysteresis (audit AP3 F2): continuously fresh and ready this long before the
    # gate opens - no stop/restart churn on a flapping state. TO-VERIFY: 2.0 s.
    arm_state_ready_hold_sec: 2.0
    dispatch_requires_arm_home: true
    # Twin: the stage-3 mock motion servers publish an idle, at-home /arm/state.
    # A Gazebo-only run without them dispatches nothing unless this is set false.
    max_goal_cost: 200
    max_stamp_age_sec: 5.0
    # max_tf_age_sec: in gripperx_arm_msgs/config/tf_freshness.yaml (one bound with
    # the arm, SR-16 E3; loaded by octopus_link.launch.py).
    max_teleop_mode_age_sec: 2.0
    link_lost_sec: 5.0
    goal_match_tolerance_m: 0.25

    # SAFETY.md F-28. How old their target list may be and still be correlated
    # against. Same kind of value as link_lost_sec and set the same way: their
    # `trash_gps` publishes unconditionally at 1 Hz, so five seconds is five
    # missed publications, i.e. a dead stream rather than a hiccup. Their
    # detector dying while their datum publisher lives leaves the LINK healthy -
    # the link watchdog measures the last frame of any topic - and leaves the
    # correlation input frozen, which makes all three F-13 gates confidently
    # wrong. Measured monotonically, so it keeps meaning something in sim time.
    max_target_list_age_sec: 5.0
    # SAFETY.md F-24. How long the ROS clock may fail to advance before the
    # gateway refuses to arm and disarms. Watched against a monotonic reference
    # that `use_sim_time` cannot switch and no publisher can stop.
    clock_stall_sec: 2.0
    # SAFETY.md F-31. How long an unproven ROS clock is reported at WARN before
    # it becomes an ERROR. It is NOT a second stall tolerance: arming is refused
    # for an unproven clock throughout, inside this grace and after it, and the
    # gate is identical in both. What it grades is the loudness.
    #
    # WHY: `/clock` is discovered, not delivered on request. The gateway
    # subscribes when it comes up and cannot see a first message before DDS has
    # matched a publisher, and that latency overlaps clock_stall_sec (2.0 s), so
    # an ordinary twin start used to raise the SAME ERROR a dead Gazebo raises -
    # about half the time on the auditor's machine. An ERROR that fires on
    # ordinary starts is an ERROR operators learn to scroll past, and that is
    # the silent-health failure F-24 exists against, wearing different clothes.
    #
    # 10.0 s is a JUDGEMENT, not a measurement: ~2.9x the largest of 25
    # measured startup-latency samples (0.22-3.48 s, idle/loaded/live-Gazebo,
    # on the laptop that runs the twin and on the auditor's). Re-measure on
    # the machine that will run it before treating it as settled.
    clock_startup_grace_sec: 10.0

    # The two CLOCK DISCONTINUITY thresholds. SR-15 rule 14 makes both of them
    # startup-only, each its OWN parameter, and neither derived from anything
    # else - a `ros2 param set` on either is refused, not applied.
    #
    # BOTH VALUES ARE `TO-VERIFY`, and since 2026-09-23 they say so the way
    # every other unmeasured value in this package says it: as the literal
    # sentinel, not as a number with a comment over it. Nothing measured either
    # of them, and they carry the same gap `clock_stall_sec` carries: every
    # `/clock` behind every number in this package has been a test fixture and
    # never a running Gazebo, so what a LOADED Gazebo does to them is
    # unanswered.
    #
    # WHAT `TO-VERIFY` DOES HERE, and it is NOT what it does for the geofence:
    # it refuses nothing. The two detectors keep running at the provisional
    # values in `goal_gateway_node.py` (`_PROVISIONAL_CLOCK_*` - 0.2 s and
    # 1.0 s, what this build has run since 2026-08-20), and the unmeasured state
    # is REPORTED instead: a WARN at startup, `external/config` on /diagnostics
    # for as long as it is true, and `clock_forward_jump_sec: unset` on
    # `external/clock`. Refusing would take away the DETECTOR rather than the
    # motion - a clock event nobody is told about, which is the 2026-09-02 shape
    # and not a safe failure. A measurement goes back in as a number here and
    # takes effect at the next start, because both are startup-only.
    #
    # SAFETY.md F-30/F-36. How far the ROS clock may go BACKWARDS before that
    # is a discontinuity rather than "no advance". It alone decides whether
    # CLOCK_JUMPED_BACK - the ninth auto-disarm trigger - ever fires. Set too
    # loose, a real backward jump is absorbed as "no advance" instead of
    # tripping the disarm: the failure is silent, not an error.
    clock_backward_eps_sec: "TO-VERIFY"
    # SAFETY.md F-40. How much MORE than a continuous clock at the observed
    # rate the ROS clock may advance before that is reported as a forward
    # discontinuity. REPORT ONLY: WARN plus a /diagnostics value, no disarm
    # and no cancel; set too loose, a real forward jump passes unreported
    # rather than raising anything. Measured as an excess over the observed
    # rate rather than as an absolute step, so a twin deliberately run fast
    # does not report on every tick.
    clock_forward_jump_sec: "TO-VERIFY"

    # TO-VERIFY. Must sit WELL above the counterpart's trigger, which is 1e-9
    # deg (~0.1 mm): at their threshold, sensor noise or a one-pixel marker
    # nudge would cancel the active goal continuously. It scales with the demo
    # area, so it follows the geofence measurement. While unset, ANY datum
    # change is treated as significant - conservative, and it invents nothing.
    datum_jump_warn_m: "TO-VERIFY"

    # Provisional, NOT user-confirmed (requirements agent's recommendation).
    max_attempts_per_target: 2

    telemetry_rate_hz: 1.0
    preview_rate_hz: 5.0
    # The gate-closing tick (arming expiry, link watchdog, cancel timeout). Its
    # own rate so that lowering the preview rate can never slow down the rate at
    # which the gate notices it should be shut (SAFETY.md F-2/F-3).
    safety_rate_hz: 5.0
    # Server availability, the in-flight re-validation and the dispatch decision.
    dispatch_rate_hz: 2.0

    # The two action interfaces. Named here so the SR-9 baseline diff and the
    # config agree about what is talked to. Goals enter Nav2 through the ACTION
    # interface only - never /goal_pose, never a chain topic (FR-12 item 3).
    navigate_action: "/navigate_to_pose"
    pick_action: "/pick_plastic"
    # How long a cancel may go unconfirmed before it is reported. Reporting is
    # the ENTIRE escalation (SR-15 rule 9): no zero-write, no mode publication,
    # and no parameter anywhere in this package that could enable one.
    # `TO-VERIFY` as a tuning value.
    cancel_confirm_timeout_sec: 3.0

    map_frame: "map"
    base_frame: "base_footprint"
    # The Octopus line calibration this gateway gates on (line_calibration_node,
    # started by gripperx-mapping via localization.launch.py). Its range, frame
    # name, map topic and map-session grace are in the `/**` section at the end
    # of this file - shared with that node, one source. No calibration -> no
    # dispatch (NO_LINE_CALIBRATION).
    line_calibration_topic: "line_calibration"
    costmap_topic: "/global_costmap/costmap"
    odom_topic: "/odometry/filtered"
    # Executor of the /tf + odometry side node: "single_threaded" | "events".
    # CPU only; see `tf_odom_executor` in goal_gateway_node.py before changing.
    tf_odom_executor: "single_threaded"
    # SUBSCRIBED ONLY. Nothing in this package publishes /teleop/set_mode or any
    # motion-chain topic, under any condition (SR-15 rules 6 and 9).
    teleop_mode_topic: "/teleop/active_mode"

# The shared reference line: the operator clicks frame post A, then post B, in
# RViz (Publish Point, fixed frame map). Nothing is persisted - it is clicked
# again at every start, and it dies by itself when the SLAM map session ends.
# Convention and interface: documentation/OCTOPUS_LINE_CALIBRATION.md.
#
# This node is NOT started by octopus_link.launch.py: it is started by
# gripperx_localization/launch/localization.launch.py (gripperx-mapping), which
# loads THIS file for it, so it lives and dies with slam_toolbox.
/gripperx/external/line_calibration_node:
  ros__parameters:
    use_sim_time: true
    expected_domain_id: 220
    map_frame: "map"
    clicked_point_topic: "/clicked_point"
    map_session_check_period_sec: 1.0
    tf_rate_hz: 10.0

# SHARED by line_calibration_node AND goal_gateway_node (audit H1): both read
# these very keys, so the node that accepts a calibration and the gateway that
# converts goals with it cannot disagree. The gateway applies ITS copy; the
# range a status carries is informational and is ignored.
/**:
  ros__parameters:
    line_frame_id: "octopus_line"
    map_topic: "/map"
    # User-stated range for the post spacing - a plausibility bound, not a
    # measurement. CHANGED 2026-09-24 by the user during the first real-robot
    # test, from 2.5-3.0 m to 2.20-2.80 m; still not a measurement. A clicked pair whose L falls outside it is
    # REJECTED (no transform, no 'calibrated' status, a red marker in RViz) and
    # the operator re-clicks: it catches a wrong post or a stray click before it
    # can reach a goal. Also the side of the geofence square. Read by
    # check_line_calibration.py from THIS file.
    expected_length_min_m: 2.2
    expected_length_max_m: 2.8
    # How long the map topic may show NO publisher before the calibration
    # counts as lost (audit M2). Unmeasured: while TO-VERIFY an empty read
    # counts at once - the calibration node drops the calibration, the gateway
    # cancels a goal in flight and blocks new dispatch.
    map_session_grace_sec: "TO-VERIFY"
