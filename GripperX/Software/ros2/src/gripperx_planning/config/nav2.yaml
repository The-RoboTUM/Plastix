planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.6
      # A* explores alternate routes when the shortest corridor is blocked.
      use_astar: true
      allow_unknown: true
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.40
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Forward only, front (+X) leads. Tighter path tracking, gentler turns near walls.
      min_vel_x: 0.0
      max_vel_x: 0.70
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.50
      min_speed_theta: 0.0
      acc_lim_x: 1.2
      acc_lim_y: 0.0
      acc_lim_theta: 1.8
      decel_lim_x: -1.2
      decel_lim_y: 0.0
      decel_lim_theta: -1.2
      vx_samples: 18
      vy_samples: 1
      vtheta_samples: 14
      sim_time: 1.1
      linear_granularity: 0.05
      angular_granularity: 0.02
      transform_tolerance: 0.2
      trans_stopped_velocity: 0.05
      prune_plan: true
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - Oscillation
        - ObstacleFootprint
        - PathDist
        - PathAlign
        - GoalDist
      ObstacleFootprint.scale: 0.12
      PathAlign.forward_point_distance: 0.30
      PathAlign.scale: 15.0
      PathDist.scale: 30.0
      GoalDist.scale: 26.0
      Oscillation.reset_dist: 0.08
      Oscillation.reset_angle: 0.35

bt_navigator:
  ros__parameters:
    use_sim_time: true
    # Set by navigation.launch.py (default_nav_to_pose_bt_xml). Do not hardcode source paths here.
    global_frame: map
    robot_base_frame: base_footprint
    # Fused state from gripperx_localization EKF (not raw /laser/odom).
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.4
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0
    behavior_plugins: ["drive_on_heading", "wait"]
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.2
      # Slightly larger than chassis box: includes steer pods (URDF track b=0.166 m).
      footprint: "[[0.27, 0.24], [0.27, -0.24], [-0.27, -0.24], [-0.27, 0.24]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 0.5
          clearing: true
          marking: true
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.2
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.27, 0.24], [0.27, -0.24], [-0.27, -0.24], [-0.27, 0.24]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 0.5
          clearing: true
          marking: true
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Wider high-cost band on global map: planner avoids narrow gaps the controller cannot use.
        cost_scaling_factor: 4.0
        inflation_radius: 0.50
      always_send_full_costmap: true
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
