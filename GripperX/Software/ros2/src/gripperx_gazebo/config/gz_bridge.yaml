# ros_gz_bridge parameter_bridge configuration (Jazzy / Gazebo Sim).
# See: https://github.com/gazebosim/ros_gz/tree/ros2/ros_gz_bridge

- topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- topic_name: /imu/data
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

- topic_name: /ground_truth/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

# /scan_raw, not /scan: scan_range_filter republishes it as /scan with returns
# below its floor removed. Same chain as the real robot (real_robot.launch.py),
# deliberately - a filter that only exists on one platform is the sim/real split
# that produced the axis-mirror confusion.
# The two sides need DIFFERENT names here, which a single topic_name cannot
# express: Gazebo still publishes /scan (that name comes from the sensor in
# gripperx_v1.lidar.xacro), while ROS must receive it as /scan_raw so
# scan_range_filter can republish the filtered version as /scan. Setting
# topic_name alone renamed BOTH sides and the bridge then looked for a Gazebo
# topic that does not exist - the ROS topic appeared, with a publisher and the
# right QoS, and carried nothing.
- ros_topic_name: /scan_raw
  gz_topic_name: /scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS

- topic_name: /camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- topic_name: /camera/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- topic_name: /camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
